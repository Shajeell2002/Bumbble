<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>BabuShona - Sign Up</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* Purple theme like stories & safety */
body {
  font-family: Arial, sans-serif;
  background: #b39ddb;
  color: #333;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px;
  background:#b39ddb;
  color:white;
  position:fixed;
  top:0; left:0; right:0;
  z-index:500;
  box-shadow:0 3px 6px rgba(0,0,0,0.15);
}
header h1 { font-size:24px; color:white; }
nav a { margin:0 10px; text-decoration:none; color:white; font-weight:bold; }
nav a:hover { text-decoration:underline; }

/* Page layout */
main {
  flex:1;
  display:flex;
  justify-content:center;
  padding:120px 20px 40px;
}

/* Signup card */
.signup-box {
  background:#fff;
  width:100%;
  max-width:440px;
  padding:30px;
  border-radius:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.12);
}

.signup-box h2 {
  text-align:center;
  font-size:26px;
  margin-bottom:18px;
  color:#4a2e8e;
}

.form-row { margin-bottom:12px; }

input, select {
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
}

input:focus, select:focus {
  border-color:#b39ddb;
  box-shadow:0 0 0 3px rgba(179,157,219,0.3);
  outline:none;
}

/* Button */
.btn {
  width:100%;
  padding:13px;
  background:#4a2e8e;
  border:none;
  color:white;
  font-weight:700;
  font-size:16px;
  border-radius:10px;
  cursor:pointer;
}
.btn:disabled { opacity:.6; cursor:not-allowed; }
.btn:hover { opacity:.9; }

/* Messages */
.msg { text-align:center; font-size:14px; margin-top:5px; }
.error { color:#c62828; }
.success { color:#2e7d32; }

.small-text { text-align:center; font-size:14px; margin-top:14px; }
.small-text a { color:#4a2e8e; font-weight:bold; text-decoration:none; }
.small-text a:hover { text-decoration:underline; }

/* Footer */
footer {
  text-align:center;
  padding:20px;
  background:#b39ddb;
  color:white;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body>

<header>
  <h1>BabuShona</h1>
  <nav id="navLinks"></nav>
</header>

<main>
  <div class="signup-box" role="region" aria-label="Signup form">
    <h2>Create Your Account</h2>

    <div class="form-row"><input id="name" type="text" placeholder="Full name" maxlength="30" autocomplete="nickname" /></div>
    <div class="form-row"><input id="age" type="number" min="13" placeholder="Age" /></div>

    <div class="form-row">
      <select id="gender">
        <option value="">Select gender</option>
        <option value="Female">Female</option>
        <option value="Male">Male</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-row"><input id="location" type="text" placeholder="City" /></div>
    <div class="form-row"><input id="email" type="email" placeholder="Email address" autocomplete="email" /></div>
    <div class="form-row"><input id="password" type="password" placeholder="Password (min 6 chars)" autocomplete="new-password" /></div>

    <button id="signupBtn" class="btn">Sign Up</button>

    <p id="errorMsg" class="msg error" aria-live="polite"></p>
    <p id="successMsg" class="msg success" aria-live="polite"></p>

    <p class="small-text">Already have an account? <a href="login.html">Login</a></p>
  </div>
</main>

<footer>&copy; 2026 BabuShona. All rights reserved.</footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAHqBD0K7Pr66he1_vax6auZ-ONzMrTp4M",
  authDomain: "bumbble-c061f.firebaseapp.com",
  databaseURL: "https://bumbble-c061f-default-rtdb.firebaseio.com",
  projectId: "bumbble-c061f",
  storageBucket: "bumbble-c061f.appspot.com",
  messagingSenderId: "213165886981",
  appId: "1:213165886981:web:c18652003444869b1bd66c"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

/* --------------------------------------------------
   NAVIGATION
-------------------------------------------------- */
const nav = document.getElementById('navLinks');
auth.onAuthStateChanged(user => {
  if (user && user.emailVerified) {
    nav.innerHTML = `
      <a href="index.html">Home</a>
      <a href="friends.html">Friends</a>
      <a href="stories.html">Stories</a>
      <a href="events.html">Events</a>
      <a href="safety.html">Safety</a>
      <a href="profile.html">Profile</a>
      <a href="#" id="logoutBtn">Logout</a>
    `;
    document.getElementById('logoutBtn').addEventListener('click', e => {
      e.preventDefault();
      auth.signOut().then(() => {
        sessionStorage.removeItem('current_user');
        window.location.href = 'login.html';
      });
    });
  } else {
    nav.innerHTML = `
      <a href="index.html">Home</a>
      <a href="friends.html">Friends</a>
      <a href="stories.html">Stories</a>
      <a href="events.html">Events</a>
      <a href="safety.html">Safety</a>
      <a href="login.html">Login</a>
      <a href="signup.html">Sign Up</a>
    `;
  }
});

/* --------------------------------------------------
   USERNAME HELPERS  (same logic as login.html / profile.html)
   Rules: lowercase a-z, 0-9, underscore, 3-20 chars.
-------------------------------------------------- */
const MIN_NAME_LENGTH = 3;

function normalizeUsername(name) {
  return String(name).trim().toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 15);
}

function isPermissionError(error) {
  return !!error && (
    error.code === 'PERMISSION_DENIED' ||
    error.code === 'database/permission-denied' ||
    /permission_denied/i.test(error.message || '')
  );
}

async function releaseUsername(username, uid) {
  if (!username || !uid) return;
  try {
    await db.ref('usernames/' + username).transaction(function (current) {
      return current === uid ? null : undefined;
    });
  } catch (err) {
    console.error('Username release error:', err);
  }
}

// Returns { username, name }; adds 4 random digits if the name is taken
// by a guest or by another registered user.
async function reserveUniqueUsername(requestedName, uid) {
  const base = normalizeUsername(requestedName);
  if (base.length < MIN_NAME_LENGTH) {
    throw new Error('Use at least ' + MIN_NAME_LENGTH + ' letters or numbers in your name.');
  }
  const shown = requestedName.trim().slice(0, 15);
  let ruleErrors = 0;

  for (let attempt = 0; attempt < 100; attempt++) {
    const suffix = attempt === 0 ? '' : String(Math.floor(1000 + Math.random() * 9000));
    const candidate = base + suffix;

    let result;
    try {
      result = await db.ref('usernames/' + candidate).transaction(function (current) {
        if (current === null || current === uid) return uid;
        return; // owned by someone else
      });
    } catch (err) {
      if (isPermissionError(err) && ++ruleErrors >= 3) throw err;
      continue;
    }

    if (result.committed) return { username: candidate, name: shown + suffix };
  }
  throw new Error('Could not find an available name. Please try another.');
}

/* Verification email. If the custom redirect domain is not authorised,
   fall back to Firebase's default page instead of failing. */
async function sendVerification(user) {
  try {
    await user.sendEmailVerification({ url: 'https://www.babushona.com/login.html' });
  } catch (err) {
    if (err.code === 'auth/unauthorized-continue-uri') {
      await user.sendEmailVerification();
    } else {
      throw err;
    }
  }
}

function friendlyError(err) {
  switch (err && err.code) {
    case 'auth/email-already-in-use':
      return 'This email is already registered. Please log in instead.';
    case 'auth/invalid-email':
      return 'Please enter a valid email address.';
    case 'auth/weak-password':
      return 'Password must be at least 6 characters.';
    case 'auth/network-request-failed':
      return 'Network problem. Please check your connection and try again.';
    case 'auth/too-many-requests':
      return 'Too many attempts. Please wait a few minutes and try again.';
  }
  if (isPermissionError(err)) {
    return 'Could not save your profile. Please try again in a moment.';
  }
  return (err && err.message) || 'Signup failed.';
}

/* --------------------------------------------------
   SIGNUP
   Order: create account -> claim unique name -> save profile
          -> send verification email.
   If any step fails, everything created so far is rolled back,
   so no half-finished accounts or stuck names are left behind.
-------------------------------------------------- */
document.getElementById('signupBtn').addEventListener('click', async function () {
  const name = document.getElementById('name').value.trim();
  const age = document.getElementById('age').value.trim();
  const gender = document.getElementById('gender').value;
  const location = document.getElementById('location').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  const btn = document.getElementById('signupBtn');

  errorMsg.textContent = '';
  successMsg.textContent = '';

  // Validate everything BEFORE creating the account
  if (!name || !email || !password) {
    errorMsg.textContent = 'Please fill in name, email and password.';
    return;
  }
  if (normalizeUsername(name).length < MIN_NAME_LENGTH) {
    errorMsg.textContent = 'Please use at least ' + MIN_NAME_LENGTH + ' English letters, numbers or underscores in your name.';
    return;
  }
  if (password.length < 6) {
    errorMsg.textContent = 'Password must be at least 6 characters.';
    return;
  }
  if (age && (Number(age) < 13 || Number(age) > 120)) {
    errorMsg.textContent = 'Please enter a valid age (13 or older).';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Creating account...';

  let user = null;
  let reserved = null;

  try {
    // 1) create the account
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    user = cred.user;
    const uid = user.uid;

    // 2) claim a unique name (digits are added if it is taken)
    reserved = await reserveUniqueUsername(name, uid);

    // 3) save the profile: name, displayName and username together
    await db.ref(`users/${uid}/public`).set({
      name: reserved.name,
      displayName: reserved.name,
      username: reserved.username,
      age: age || 'N/A',
      gender: gender || '',
      location: location || '',
      pic: '',
      online: false,
      isGuest: false,
      testAccount: false
    });

    await db.ref(`userPrivate/${uid}`).set({
      email: email,
      createdAt: Date.now()
    });

    // 4) verification email last, so a failure above never leaves a mail behind
    await sendVerification(user);

    // 5) finished: sign out until the email is verified
    await auth.signOut();
    sessionStorage.removeItem('current_user');

    let message = 'Account created — verification email sent. Check your Inbox & Spam folder, and verify before login.';
    if (normalizeUsername(name) !== reserved.username) {
      message += ' That name was taken, so your name is ' + reserved.name + '.';
    }
    successMsg.textContent = message;
    btn.textContent = 'Done';
    setTimeout(() => { window.location.href = 'login.html'; }, 5000);

  } catch (err) {
    console.error('Signup error:', err);

    // Roll back whatever was created, so the user can simply try again
    if (user) {
      try {
        await db.ref().update({
          [`users/${user.uid}/public`]: null,
          [`userPrivate/${user.uid}`]: null
        });
      } catch (e) { console.warn('Profile rollback:', e.message); }

      if (reserved) await releaseUsername(reserved.username, user.uid);

      try { await user.delete(); }
      catch (e) { await auth.signOut().catch(() => {}); }
    }

    errorMsg.textContent = friendlyError(err);
    btn.disabled = false;
    btn.textContent = 'Sign Up';
  }
});
</script>
</body>
</html>
