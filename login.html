<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #b39ddb;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

header {
    background: #b39ddb;
    color: white;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
}

header h1 { margin: 0; font-size: 26px; font-weight: bold; color: white; }

nav { display: flex; flex-wrap: wrap; gap: 15px; }
nav a { text-decoration: none; color: white; font-weight: 500; }
nav a:hover { text-decoration: underline; }

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
    padding: 35px 15px;
}

.login-form {
    background: white;
    padding: 32px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.13);
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.login-form h2 { text-align: center; margin: 0; color: #4a2e8e; font-size: 27px; }
.subtitle { text-align: center; color: #666; line-height: 1.5; margin: 0 0 5px; }

.login-form input {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}

.login-form input:focus { outline: 2px solid #b39ddb; border-color: #4a2e8e; }

.login-form button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #4a2e8e;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
}

.login-form button:hover { background: #38216e; }
.login-form button:disabled { opacity: 0.65; cursor: not-allowed; }

.forgot-password { text-align: right; font-size: 14px; margin-top: -5px; }
.forgot-password a { color: #4a2e8e; text-decoration: none; font-weight: bold; }

.divider { display: flex; align-items: center; gap: 12px; color: #888; font-size: 13px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #ddd; }

.guest-button { background: #8e44ad !important; }
.guest-button:hover { background: #71368a !important; }

.guest-note { font-size: 12px; text-align: center; color: #777; line-height: 1.5; }

.register-note { text-align: center; font-size: 14px; color: #555; }
.register-note a { color: #4a2e8e; font-weight: bold; text-decoration: none; }

#statusMessage {
    display: none;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}
#statusMessage.error { display: block; background: #ffebee; color: #b71c1c; }
#statusMessage.success { display: block; background: #e8f5e9; color: #1b5e20; }

footer { text-align: center; padding: 18px; background: #b39ddb; color: white; margin-top: auto; }
footer p { margin: 0; }

@media (max-width: 600px) {
    header { justify-content: center; text-align: center; padding: 15px; }
    nav { justify-content: center; gap: 12px; }
    .login-form { padding: 25px 20px; }
}

<body>

<header>
    <h1>BabuShona 💜</h1>

    <nav id="navLinks">
        <a href="index.html">Home</a>
        <a href="friends.html">Friends</a>
        <a href="stories.html">Stories</a>
        <a href="safety.html">Safety</a>

<main class="container">
<form class="login-form" id="loginForm">

    <h2>Welcome to BabuShona!</h2>

    <p class="subtitle">Meet new people, make friends and connect. 💜</p>

    <div id="statusMessage" role="status" aria-live="polite"></div>

    <!-- EMAIL LOGIN -->
    <input type="email" id="email" placeholder="Email address"
           autocomplete="email" aria-label="Email address" required>

    <input type="password" id="password" placeholder="Password"
           autocomplete="current-password" aria-label="Password" required>

    <div class="forgot-password">
        <a href="#" id="resetPassword">Forgot Password?</a>
    </div>

    <button type="submit" id="loginButton">Login with Email</button>

    <div class="divider">OR</div>

    <!-- GUEST LOGIN -->
    <input type="text" id="guestName" placeholder="Enter your guest name"
           maxlength="30" minlength="3" autocomplete="nickname" aria-label="Guest name">

    <button type="button" class="guest-button" id="guestLoginButton">
        Continue as Guest
    </button>

    <p class="guest-note">
        No email or password required.
        Enter a name to continue as a guest.
    </p>

        New to BabuShona?
        <a href="signup.html">Create an account</a>
    </div>

</form>

<script>
/* --------------------------------------------------
   STATUS MESSAGES
-------------------------------------------------- */
const statusMessage = document.getElementById("statusMessage");
const nav = document.getElementById("navLinks");

function showMessage(message, type = "error") {
    statusMessage.textContent = message;
    statusMessage.className = type;
}

function clearMessage() {
    statusMessage.textContent = "";
    statusMessage.className = "";
}

/* --------------------------------------------------
   USERNAME HELPERS
   Rules require: lowercase a-z, 0-9, underscore, 3-20 chars.
   Base is max 15 chars + 4-digit suffix = max 19.
-------------------------------------------------- */
const MIN_NAME_LENGTH = 3;

function normalizeUsername(name) {
    return String(name)
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9_]/g, "")
        .slice(0, 15);
}

function isPermissionError(error) {
    return !!error && (
        error.code === "PERMISSION_DENIED" ||
        error.code === "database/permission-denied" ||
        /permission_denied/i.test(error.message || "")
    );
}

/* Release a username, only if this uid owns it. */
async function releaseUsername(username, uid) {
    if (!username || !uid) return;
    try {
        await db.ref("usernames/" + username).transaction(function(current) {
            return current === uid ? null : undefined;
        });
    } catch (err) {
        console.error("Username release error:", err);
    }
}

/* --------------------------------------------------
   ATOMIC USERNAME RESERVATION
   Returns { username, name }:
     username = unique lowercase key, e.g. "ravi4827"
     name     = display name with the same digits, e.g. "Ravi4827"
-------------------------------------------------- */
async function reserveUniqueUsername(requestedName, uid) {
    const base = normalizeUsername(requestedName);

    if (base.length < MIN_NAME_LENGTH) {
        throw new Error(
            "Use at least " + MIN_NAME_LENGTH + " letters or numbers in your name."
        );
    }

    const shown = requestedName.trim().slice(0, 15);
    let ruleErrors = 0;

    for (let attempt = 0; attempt < 100; attempt++) {
        const suffix = attempt === 0
            ? ""
            : String(Math.floor(1000 + Math.random() * 9000));
        const candidate = base + suffix;

        let result;
        try {
            result = await db.ref("usernames/" + candidate)
                .transaction(function(current) {
                    // Claim an unused name, or reuse this user's own reservation.
                    if (current === null || current === uid) return uid;
                    return; // abort: owned by someone else
                });
        } catch (err) {
            // Repeated rule rejections mean the rules are wrong, not the name.
            if (isPermissionError(err) && ++ruleErrors >= 3) throw err;
            continue;
        }

        if (result.committed) {
            return { username: candidate, name: shown + suffix };
        }
    }

    throw new Error("Could not find an available username. Please try another name.");
}

/* --------------------------------------------------
   AUTHENTICATION STATE AND NAVIGATION
-------------------------------------------------- */
auth.onAuthStateChanged(function(user) {
    if (!user) return;

    const savedUser = sessionStorage.getItem("current_user");

    if (savedUser === user.uid && (user.isAnonymous || user.emailVerified)) {
        window.location.replace("friends.html");
        return;
    }

    if (user.isAnonymous || user.emailVerified) {
        nav.innerHTML = `
            <a href="index.html">Home</a>
            <a href="friends.html">Friends</a>
            <a href="stories.html">Stories</a>
            <a href="safety.html">Safety</a>
            <a href="#" id="logoutBtn">Logout</a>
        `;

        document.getElementById("logoutBtn")
            .addEventListener("click", async function(e) {
                e.preventDefault();

                try {
                    // Guests give their name back when they log out.
                    if (user.isAnonymous) {
                        await releaseUsername(
                            sessionStorage.getItem("guest_username"),
                            user.uid
                        );
                    }

                    sessionStorage.removeItem("current_user");
                    sessionStorage.removeItem("guest_name");
                    sessionStorage.removeItem("guest_username");

                    await auth.signOut();
                    window.location.href = "login.html";
                } catch (error) {
                    console.error("Logout error:", error);
                    showMessage("Unable to log out. Please try again.");
                }
            });
    }
});

/* --------------------------------------------------
   EMAIL AND PASSWORD LOGIN
-------------------------------------------------- */
document.getElementById("loginForm")
    .addEventListener("submit", async function(e) {
        e.preventDefault();
        clearMessage();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const loginButton = document.getElementById("loginButton");
        const guestButton = document.getElementById("guestLoginButton");

        loginButton.disabled = true;
        guestButton.disabled = true;
        loginButton.textContent = "Logging in...";

        try {
            const result = await auth.signInWithEmailAndPassword(email, password);
            const user = result.user;

            if (!user.emailVerified) {
                await auth.signOut();
                showMessage("Please verify your email address before logging in.");
                return;
            }

            // Write to a child path so the profile's username rule is not
            // re-checked, and never let this block a successful login.
            try {
                await db.ref("users/" + user.uid + "/public/lastLogin")
                    .set(Date.now());
            } catch (err) {
                console.warn("lastLogin not saved:", err);
            }

            sessionStorage.setItem("current_user", user.uid);
            sessionStorage.removeItem("guest_name");
            sessionStorage.removeItem("guest_username");

            showMessage("Login successful! Welcome back.", "success");
            window.location.href = "friends.html";

        } catch (error) {
            console.error("Email login error:", error);
            showMessage("Login failed: " + error.message);

        } finally {
            loginButton.disabled = false;
            guestButton.disabled = false;
            loginButton.textContent = "Login with Email";
        }
    });

/* --------------------------------------------------
   GUEST LOGIN WITH UNIQUE USERNAME
-------------------------------------------------- */
document.getElementById("guestLoginButton")
    .addEventListener("click", async function() {
        clearMessage();

        const guestNameInput = document.getElementById("guestName");
        const guestName = guestNameInput.value.trim();
        const guestButton = document.getElementById("guestLoginButton");
        const loginButton = document.getElementById("loginButton");

        if (guestName.length < MIN_NAME_LENGTH || guestName.length > 30) {
            showMessage(
                "Please enter a guest name between " + MIN_NAME_LENGTH +
                " and 30 characters."
            );
            guestNameInput.focus();
            return;
        }

        if (/[\u0000-\u001F\u007F]/.test(guestName)) {
            showMessage("Please enter a valid guest name.");
            return;
        }

        if (normalizeUsername(guestName).length < MIN_NAME_LENGTH) {
            showMessage(
                "Please use at least " + MIN_NAME_LENGTH +
                " English letters, numbers or underscores."
            );
            return;
        }

        guestButton.disabled = true;
        loginButton.disabled = true;
        guestButton.textContent = "Checking username...";

        let reserved = null;        // { username, name }
        let guestUid = null;
        let profileSaved = false;

        try {
            let user = auth.currentUser;

            if (!user || !user.isAnonymous) {
                const result = await auth.signInAnonymously();
                user = result.user;
            }

            guestUid = user.uid;

            // If this guest already holds a name, remember it so it can be
            // released after the new one is saved (one name per guest).
            let previousUsername = null;
            try {
                const prev = await db.ref("users/" + guestUid + "/public/username")
                    .once("value");
                if (prev.exists() && typeof prev.val() === "string") {
                    previousUsername = prev.val();
                }
            } catch (err) {
                // No existing profile, or not readable: nothing to release.
            }

            // 1) Reserve the name first. The profile rule checks this claim.
            reserved = await reserveUniqueUsername(guestName, guestUid);

            // 2) Save the profile. username and name are plain strings.
            await db.ref("users/" + guestUid + "/public").update({
                name: reserved.name,
                displayName: reserved.name,
                username: reserved.username,
                isGuest: true,
                lastLogin: Date.now()
            });

            profileSaved = true;

            if (previousUsername && previousUsername !== reserved.username) {
                await releaseUsername(previousUsername, guestUid);
            }

            sessionStorage.setItem("current_user", guestUid);
            sessionStorage.setItem("guest_name", reserved.name);
            sessionStorage.setItem("guest_username", reserved.username);

            if (reserved.username !== normalizeUsername(guestName)) {
                showMessage(
                    "That name is taken. Your name is " + reserved.name + ".",
                    "success"
                );
            } else {
                showMessage("Welcome to BabuShona, " + reserved.name + "!", "success");
            }

            window.location.href = "friends.html";

        } catch (error) {
            console.error("Guest login error:", error);

            // Give the reserved name back if the profile was not saved.
            if (reserved && guestUid && !profileSaved) {
                await releaseUsername(reserved.username, guestUid);
            }

            if (error.code === "auth/operation-not-allowed") {
                showMessage(
                    "Guest login is not enabled. Enable Anonymous " +
                    "Authentication in Firebase Console."
                );
            } else if (isPermissionError(error)) {
                showMessage(
                    "Firebase denied access. Check your Realtime Database rules " +
                    "and the console for the exact permission_denied path."
                );
            } else {
                showMessage("Guest login failed: " + error.message);
            }

        } finally {
            guestButton.disabled = false;
            loginButton.disabled = false;
            guestButton.textContent = "Continue as Guest";
        }
    });

/* --------------------------------------------------
   FORGOT PASSWORD
-------------------------------------------------- */
document.getElementById("resetPassword")
    .addEventListener("click", async function(e) {
        e.preventDefault();
        clearMessage();

        const email = document.getElementById("email").value.trim();

        if (!email) {
            showMessage(
                "Please enter your email address before requesting a password reset."
            );
            document.getElementById("email").focus();
            return;
        }

        try {
            try {
                await auth.sendPasswordResetEmail(email, {
                    url: "https://www.babushona.com/login.html"
                });
            } catch (err) {
                // Domain not authorized yet: fall back to Firebase's default page.
                if (err.code === "auth/unauthorized-continue-uri") {
                    await auth.sendPasswordResetEmail(email);
                } else {
                    throw err;
                }
            }

            showMessage(
                "If the account is eligible, a password reset email has been sent. Please check your inbox.",
                "success"
            );

        } catch (error) {
            console.error("Password reset error:", error);
            showMessage("Unable to send the password reset email: " + error.message);
        }
    });
</script>
