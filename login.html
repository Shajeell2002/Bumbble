
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BabuShona - Login</title>
<meta name="description" content="Log in or join BabuShona to meet people, make friends and connect.">

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #b39ddb;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

header {
    background: #b39ddb;
    color: white;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
}

header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: bold;
    color: white;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
}

nav a {
    text-decoration: none;
    color: white;
    font-weight: 500;
}

nav a:hover { text-decoration: underline; }

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
    padding: 35px 15px;
}

.login-form {
    background: white;
    padding: 32px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.13);
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.login-form h2 {
    text-align: center;
    margin: 0;
    color: #4a2e8e;
    font-size: 27px;
}

.subtitle {
    text-align: center;
    color: #666;
    line-height: 1.5;
    margin: 0 0 5px;
}

.login-form input {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}

.login-form input:focus {
    outline: 2px solid #b39ddb;
    border-color: #4a2e8e;
}

.login-form button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #4a2e8e;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
}

.login-form button:hover { background: #38216e; }

.login-form button:disabled {
    opacity: 0.65;
    cursor: not-allowed;
}

.forgot-password {
    text-align: right;
    font-size: 14px;
    margin-top: -5px;
}

.forgot-password a {
    color: #4a2e8e;
    text-decoration: none;
    font-weight: bold;
}

.divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #888;
    font-size: 13px;
}

.divider::before,
.divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #ddd;
}

.guest-button {
    background: #8e44ad !important;
}

.guest-button:hover {
    background: #71368a !important;
}

.guest-note {
    font-size: 12px;
    text-align: center;
    color: #777;
    line-height: 1.5;
}

.register-note {
    text-align: center;
    font-size: 14px;
    color: #555;
}

.register-note a {
    color: #4a2e8e;
    font-weight: bold;
    text-decoration: none;
}

#statusMessage {
    display: none;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

#statusMessage.error {
    display: block;
    background: #ffebee;
    color: #b71c1c;
}

#statusMessage.success {
    display: block;
    background: #e8f5e9;
    color: #1b5e20;
}

footer {
    text-align: center;
    padding: 18px;
    background: #b39ddb;
    color: white;
    margin-top: auto;
}

footer p { margin: 0; }

@media (max-width: 600px) {
    header {
        justify-content: center;
        text-align: center;
        padding: 15px;
    }

    nav {
        justify-content: center;
        gap: 12px;
    }

    .login-form { padding: 25px 20px; }
}
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    apiKey: "AIzaSyBkDyP8KPuQc_knXLH9lhtQWDLb59xRJWs",
    authDomain: "bumbble-c061f.firebaseapp.com",
    databaseURL: "https://bumbble-c061f-default-rtdb.firebaseio.com",

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

</head>

<body>

<header>
    <h1>BabuShona 💜</h1>

    <nav id="navLinks">
        <a href="index.html">Home</a>
        <a href="friends.html">Friends</a>
        <a href="stories.html">Stories</a>
        <a href="safety.html">Safety</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
    </nav>
</header>

<main class="container">
<form class="login-form" id="loginForm">

    <h2>Welcome to BabuShona!</h2>

    <p class="subtitle">
        Meet new people, make friends and connect. 💜
    </p>

    <div id="statusMessage" role="status" aria-live="polite"></div>

    <!-- EMAIL LOGIN -->
    <input
        type="email"
        id="email"
        placeholder="Email address"
        autocomplete="email"
        aria-label="Email address"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        aria-label="Password"
        required
    >

    <div class="forgot-password">
        <a href="#" id="resetPassword">Forgot Password?</a>
    </div>

    <button type="submit" id="loginButton">
        Login with Email
    </button>

    <div class="divider">OR</div>

    <!-- GUEST LOGIN -->
    <input
        type="text"
        id="guestName"
        placeholder="Enter your guest name"
        maxlength="30"
        minlength="2"
        autocomplete="nickname"
        aria-label="Guest name"
    >

    <button type="button" class="guest-button" id="guestLoginButton">
        Continue as Guest
    </button>

    <p class="guest-note">
        No email or password required.
        Enter a name to continue as a guest.
    </p>

    <div class="register-note">
        New to BabuShona?
        <a href="signup.html">Create an account</a>
    </div>

</form>
</main>

<footer>
    <p>&copy; 2026 BabuShona. All rights reserved.</p>
</footer>

<script>
/* --------------------------------------------------
   STATUS MESSAGES
-------------------------------------------------- */

const statusMessage = document.getElementById("statusMessage");
const nav = document.getElementById("navLinks");

function showMessage(message, type = "error") {
    statusMessage.textContent = message;
    statusMessage.className = type;
}

function clearMessage() {
    statusMessage.textContent = "";
    statusMessage.className = "";
}

/* --------------------------------------------------
   USERNAME NORMALIZATION
-------------------------------------------------- */

function normalizeUsername(name) {
    return name
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9_]/g, "")
        .slice(0, 15);
}

/* --------------------------------------------------
   ATOMIC USERNAME RESERVATION

   The /usernames index must contain existing usernames
   before this can guarantee uniqueness across old users.
-------------------------------------------------- */

async function reserveUniqueUsername(requestedName, uid) {
    const base = normalizeUsername(requestedName);

    if (base.length < 2) {
        throw new Error(
            "Use at least 2 letters or numbers in your guest name."
        );
    }

    for (let attempt = 0; attempt < 100; attempt++) {
        let candidate;

        if (attempt === 0) {
            candidate = base;
        } else {
            const suffix = Math.floor(
                1000 + Math.random() * 9000
            );

            // Keep the total username length within 19 characters.
            candidate = base.slice(0, 15) + suffix;
        }

        const usernameRef = db.ref("usernames/" + candidate);

        const result = await usernameRef.transaction(function(current) {
            // Claim an unused username, or reuse this user's reservation.
            if (current === null || current === uid) {
                return uid;
            }

            // Abort if another account owns the username.
            return;
        });

        if (result.committed) {
            return candidate;
        }
    }

    throw new Error(
        "Could not find an available username. Please try another name."
    );
}

/* --------------------------------------------------
   AUTHENTICATION STATE AND NAVIGATION
-------------------------------------------------- */

auth.onAuthStateChanged(function(user) {
    if (!user) return;

    const savedUser = sessionStorage.getItem("current_user");

    if (
        savedUser === user.uid &&
        (user.isAnonymous || user.emailVerified)
    ) {
        window.location.replace("friends.html");
        return;
    }

    if (user.isAnonymous || user.emailVerified) {
        nav.innerHTML = `
            <a href="index.html">Home</a>
            <a href="friends.html">Friends</a>
            <a href="stories.html">Stories</a>
            <a href="safety.html">Safety</a>
            <a href="#" id="logoutBtn">Logout</a>
        `;

        document.getElementById("logoutBtn")
            .addEventListener("click", async function(e) {
                e.preventDefault();

                try {
                    sessionStorage.removeItem("current_user");
                    sessionStorage.removeItem("guest_name");

                    await auth.signOut();
                    window.location.href = "login.html";
                } catch (error) {
                    console.error("Logout error:", error);
                    showMessage("Unable to log out. Please try again.");
                }
            });
    }
});

/* --------------------------------------------------
   EMAIL AND PASSWORD LOGIN
-------------------------------------------------- */

document.getElementById("loginForm")
    .addEventListener("submit", async function(e) {
        e.preventDefault();
        clearMessage();

        const email = document.getElementById("email")
            .value.trim();

        const password = document.getElementById("password").value;
        const loginButton = document.getElementById("loginButton");
        const guestButton = document.getElementById("guestLoginButton");

        loginButton.disabled = true;
        guestButton.disabled = true;
        loginButton.textContent = "Logging in...";

        try {
            const result = await auth.signInWithEmailAndPassword(
                email,
                password
            );

            const user = result.user;

            if (!user.emailVerified) {
                await auth.signOut();

                showMessage(
                    "Please verify your email address before logging in."
                );
                return;
            }

            await db.ref("users/" + user.uid + "/public").update({
                lastLogin: Date.now()
            });

            sessionStorage.setItem("current_user", user.uid);
            sessionStorage.removeItem("guest_name");

            showMessage("Login successful! Welcome back.", "success");
            window.location.href = "friends.html";

        } catch (error) {
            console.error("Email login error:", error);
            showMessage("Login failed: " + error.message);

        } finally {
            loginButton.disabled = false;
            guestButton.disabled = false;
            loginButton.textContent = "Login with Email";
        }
    });

/* --------------------------------------------------
   GUEST LOGIN WITH UNIQUE USERNAME
-------------------------------------------------- */

document.getElementById("guestLoginButton")
    .addEventListener("click", async function() {
        clearMessage();

        const guestName = document.getElementById("guestName")
            .value.trim();

        const guestButton = document.getElementById("guestLoginButton");
        const loginButton = document.getElementById("loginButton");

        if (guestName.length < 2 || guestName.length > 30) {
            showMessage(
                "Please enter a guest name between 2 and 30 characters."
            );
            document.getElementById("guestName").focus();
            return;
        }

        if (/[\u0000-\u001F\u007F]/.test(guestName)) {
            showMessage("Please enter a valid guest name.");
            return;
        }

        if (!normalizeUsername(guestName) ||
            normalizeUsername(guestName).length < 2) {
            showMessage(
                "Please use at least 2 English letters, numbers or underscores."
            );
            return;
        }

        guestButton.disabled = true;
        loginButton.disabled = true;
        guestButton.textContent = "Checking username...";

        let reservedUsername = null;
        let guestUid = null;
        let profileSaved = false;

        try {
            let user = auth.currentUser;

            if (!user || !user.isAnonymous) {
                const result = await auth.signInAnonymously();
                user = result.user;
            }

            guestUid = user.uid;

            // Reserve the name before writing the profile.
            reservedUsername = await reserveUniqueUsername(
                guestName,
                guestUid
            );

            await db.ref("users/" + guestUid + "/public").update({
                name: reservedUsername,
                displayName: reservedUsername,
                username: reservedUsername,
                isGuest: true,
                lastLogin: Date.now()
            });

            profileSaved = true;

            sessionStorage.setItem("current_user", guestUid);
            sessionStorage.setItem("guest_name", reservedUsername);

            if (normalizeUsername(guestName) !== reservedUsername) {
                showMessage(
                    "That username is taken. Your username is " +
                    reservedUsername + ".",
                    "success"
                );
            } else {
                showMessage(
                    "Welcome to BabuShona, " + reservedUsername + "!",
                    "success"
                );
            }

            window.location.href = "friends.html";

        } catch (error) {
            console.error("Guest login error:", error);

            // Release a newly reserved username if profile saving failed.
            if (reservedUsername && guestUid && !profileSaved) {
                try {
                    await db.ref("usernames/" + reservedUsername)
                        .transaction(function(current) {
                            return current === guestUid
                                ? null
                                : undefined;
                        });
                } catch (cleanupError) {
                    console.error(
                        "Username cleanup error:",
                        cleanupError
                    );
                }
            }

            if (error.code === "auth/operation-not-allowed") {
                showMessage(
                    "Guest login is not enabled. Enable Anonymous " +
                    "Authentication in Firebase Console."
                );
            } else if (
                error.code === "PERMISSION_DENIED" ||
                error.code === "database/permission-denied"
            ) {
                showMessage(
                    "Firebase denied access. Please check your Realtime " +
                    "Database rules, including the usernames rule."
                );
            } else {
                showMessage(
                    "Guest login failed: " + error.message
                );
            }

        } finally {
            guestButton.disabled = false;
            loginButton.disabled = false;
            guestButton.textContent = "Continue as Guest";
        }
    });

/* --------------------------------------------------
   FORGOT PASSWORD
-------------------------------------------------- */

document.getElementById("resetPassword")
    .addEventListener("click", async function(e) {
        e.preventDefault();
        clearMessage();

        const email = document.getElementById("email")
            .value.trim();

        if (!email) {
            showMessage(
                "Please enter your email address before requesting a password reset."
            );
            document.getElementById("email").focus();
            return;
        }

        try {
            await auth.sendPasswordResetEmail(email, {
                url: "https://www.babushona.com/login.html"
            });

            showMessage(
                "If the account is eligible, a password reset email has been sent. Please check your inbox.",
                "success"
            );

        } catch (error) {
            console.error("Password reset error:", error);

            showMessage(
                "Unable to send the password reset email: " + error.message
            );
        }
    });
</script>

</body>
</html>
