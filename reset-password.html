<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - Babushona</title>
</head>
<body>
  <h2>Reset Your Babushona Password</h2>
  <form id="reset-form">
    <input type="password" id="new-password" placeholder="Enter new password" required />
    <button type="submit">Update Password</button>
  </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Your Firebase config
  const firebaseConfig = {
  apiKey: "AIzaSyDEoy2Z6kfDMoIOtzeTJdA0FphkoiXJo4g",
  authDomain: "[www.babushona.com](https://www.babushona.com)",
      databaseURL: "https://bumbble-c061f-default-rtdb.firebaseio.com",
      projectId: "bumbble-c061f",
      storageBucket: "bumbble-c061f.appspot.com",
  messagingSenderId: "213165886981",
  appId: "1:213165886981:web:c18652003444869b1bd66c"
};
    
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Get the reset code (oobCode) sent by Firebase in the URL
    const urlParams = new URLSearchParams(window.location.search);
    const oobCode = urlParams.get('oobCode');

    document.getElementById('reset-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;

      if (!oobCode) {
        alert("Invalid or expired reset link.");
        return;
      }

      confirmPasswordReset(auth, oobCode, newPassword)
        .then(() => {
          alert("Password updated successfully! You can now log in.");
          window.location.href = "https://www.babushona.com/login";
        })
        .catch((error) => {
          alert("Error resetting password: " + error.message);
        });
    });
  </script>
</body>
</html>
